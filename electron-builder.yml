appId: com.stobs.app
productName: Stobs
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
mac:
  category: public.app-category.productivity
  target:
    - dmg
    - zip
  # Stobs reaches the Apple apps and reads the frontmost window title, so macOS
  # requires these usage strings before it will show the permission prompts.
  extendInfo:
    NSAppleEventsUsageDescription: >-
      Stobs uses Calendar, Reminders, Notes and Mail on your Mac to read and
      create items on your behalf.
    NSCalendarsUsageDescription: >-
      Stobs reads and creates events in your calendar.
    NSRemindersUsageDescription: >-
      Stobs reads and creates your reminders.
    LSUIElement: false
  hardenedRuntime: true
  gatekeeperAssist: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
dmg:
  artifactName: Stobs-${version}-${arch}.dmg
